# ============================================================
# 老六中控 · OTA 升级信息源（build.sh 拷贝到 APK assets/ota.properties）
#
# 信息源（Ota.checkUpdate）—— 默认走 GitHub Releases：
#   1) OTA_JSON_URL  —— 可选：自建 version.json（留空即跳过，只用 GitHub）
#   2) REPO_OWNER + REPO_NAME —— GitHub releases（tag 形如 v1.2.4 自动识别）
#
# 「失败」不只是网络不通：返回 ok:false、缺 versionCode、缺 downloadUrl 都算失败，
# 会自动继续下一级；两级全挂时，检查结果里会列出每一级的失败原因。
#
# 国内加速：MIRROR 用于 GitHub 检查与下载回落（默认 gh-proxy.com），
# 覆盖 objects.githubusercontent.com 被墙的场景；系统环境变量 UPDATE_MIRROR 可覆盖
#
# 自建 JSON（可选）schema：versionName/versionCode/downloadUrl/sha256/changelog/force/size
# ============================================================
REPO_OWNER=yanziruxue
REPO_NAME=Z6-central-control
OTA_JSON_URL=
MIRROR=https://gh-proxy.com/
