# ============================================================
# 老六中控 · OTA 升级信息源（build.sh 拷贝到 APK assets/ota.properties）
#
# 信息源（Ota.checkUpdate）—— 主源走自托管 Git（git.ziruxue.top / Gitea），GitHub 保底：
#   1) OTA_JSON_URL        —— 可选：自建 version.json（留空即跳过）
#   2) SELF_OTA_*           —— 自托管 Git 主源（Gitea releases/latest，tag 形如 v1.2.4 自动识别）
#   3) REPO_OWNER+REPO_NAME —— GitHub releases（保底，主源挂时回落）
#
# 源顺序：自建 JSON(可选) → 自托管 Git(主源) → GitHub(保底)。
# 任一级返回 ok:false / 缺 versionCode / 缺 downloadUrl 都算失败，自动继续下一级；
# 主源挂时检查与下载都会落到 GitHub（含 APK 下载回落）。
#
# 国内加速：MIRROR 用于检查与下载回落（默认 gh-proxy.com），
# 覆盖 objects.githubusercontent.com 被墙的场景；系统环境变量 UPDATE_MIRROR 可覆盖
#
# 自建 JSON（可选）schema：versionName/versionCode/downloadUrl/sha256/changelog/force/size
# ============================================================
# —— 自托管 OTA 主源（git.ziruxue.top，Gitea）——
SELF_OTA_BASE=https://git.ziruxue.top
SELF_OTA_OWNER=yanzi
SELF_OTA_REPO=Z6

# —— GitHub 保底源 ——
REPO_OWNER=yanziruxue
REPO_NAME=Z6-central-control
OTA_JSON_URL=
MIRROR=https://gh-proxy.com/
