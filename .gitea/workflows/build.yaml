name: Build APK (Gitea)

# 触发：打 v* tag 推送即构建（普通 push / 改代码不触发）。
# 版本号 = tag（如 v2.0.10），build.sh 的 VER_NAME 必须与 tag 一致，否则流水线拒绝出包。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # 也允许在 Gitea 网页手动触发（默认用当前默认分支 HEAD）

jobs:
  build:
    runs-on: [linux]            # 自托管 Linux runner（act_runner 默认带 linux 标签）
    container:
      image: git.ziruxue.top/yanzi/android-sdk:35
      # 镜像由仓库根 Dockerfile.android 构建并推到本仓库 registry：
      #   docker build -t git.ziruxue.top/yanzi/android-sdk:35 -f Dockerfile.android .
      #   docker push git.ziruxue.top/yanzi/android-sdk:35
      # 若 runner 不想用容器：删掉 container 段，改在 runner 主机装好 SDK，
      # 并把 ANDROID_SDK_ROOT/JDK_BIN 设为 runner 主机路径即可（build.sh 已跨平台）。
    env:
      ANDROID_SDK_ROOT: /opt/android-sdk
      JDK_BIN: ""               # 留空 → build.sh 用 PATH 里的 javac 反推 JDK 目录
      PY: python3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 还原签名 keystore（从 secret 解码，绝不落库）
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_STORE_PASS }}
          KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "⚠️ 未配置 KEYSTORE_B64，改用调试签名（仅自测，不能与已装 release 包共存）"
          else
            echo "$KEYSTORE_B64" | base64 -d > /tmp/l6-release.jks
            printf 'storeFile=/tmp/l6-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KS_PASS" "$KS_ALIAS" "$KEY_PASS" > android/keystore.properties
            echo "✓ release 密钥已就绪"
          fi

      - name: 校验版本号一致（tag 必须等于 build.sh 的 VER_NAME）
        env:
          TAG: ${{ gitea.ref_name }}
        run: |
          set -e
          VER_NAME=$(grep -E '^VER_NAME=' android/build.sh | head -1 | cut -d= -f2- | tr -d '"')
          echo "tag=$TAG  build.sh VER_NAME=$VER_NAME"
          [ "v$VER_NAME" = "$TAG" ] || { echo "✗ 版本不一致：请同步 build.sh 的 VER_NAME 与 tag"; exit 1; }

      - name: 构建 APK
        run: bash android/build.sh

      - name: 产物反查校验
        env:
          TAG: ${{ gitea.ref_name }}
        run: |
          set -e
          APK=$(ls dist/Z6CC-*.apk | head -1)
          echo "APK=$APK"
          APKCHECK=$(ls android/tools/apkcheck*.py | sort | tail -1)
          echo "apkcheck=$APKCHECK"
          python3 "$APKCHECK" "$APK"

      # —— 发到 Gitea Release（可下载）：构建机把包留在 Gitea，开发者拉回本地再传 GitHub ——
      # Gitea Actions 上下文提供 gitea.server_url / gitea.repository，无需硬编码域名。
      # 车机 OTA 现在走 GitHub（见 Ota.java），本 Gitea Release 仅作「构建产物分发/下载站」。
      - name: 创建 Gitea Release + 上传 APK（可下载）
        env:
          GITEA_SERVER: ${{ gitea.server_url }}
          GITEA_REPO: ${{ gitea.repository }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          TAG: ${{ gitea.ref_name }}
        run: |
          set -e
          APK=$(ls dist/Z6CC-*.apk | head -1)
          python3 - <<'PYEOF'
          import os, sys, json, time, urllib.request, urllib.error, urllib.parse, ssl
          ctx = ssl.create_default_context()
          server = os.environ["GITEA_SERVER"].rstrip("/")
          repo   = os.environ["GITEA_REPO"]
          token  = os.environ["GITEA_TOKEN"]
          tag    = os.environ["TAG"]
          apk    = os.environ["APK"]
          apk_name = os.path.basename(apk)
          hdr = {"Authorization": "token " + token, "Content-Type": "application/json"}
          api = server + "/api/v1/repos/" + repo

          def req(method, url, data=None, binary=False, extra=None):
              h = dict(hdr)
              if extra: h.update(extra)
              body = None
              if data is not None:
                  body = data if binary else json.dumps(data).encode()
              r = urllib.request.Request(url, data=body, method=method, headers=h)
              return urllib.request.urlopen(r, timeout=30, context=ctx)

          # 1) 找已有 release（按 tag），没有就建
          rel_id = None
          try:
              rel_id = json.load(req("GET", api + "/releases/tags/" + tag))["id"]
              print("复用已有 release id", rel_id)
          except urllib.error.HTTPError as e:
              if e.code != 404: raise
          if rel_id is None:
              r = req("POST", api + "/releases",
                      {"tag_name": tag, "name": tag, "body": "Gitea Runner 自动构建 " + tag,
                       "draft": False, "prerelease": False, "make_latest": "true"})
              rel_id = json.load(r)["id"]
              print("已创建 release id", rel_id)

          # 2) 同名资产先删后传（幂等，重跑不重复）
          try:
              for a in json.load(req("GET", api + "/releases/%d/assets" % rel_id)):
                  if a["name"] == apk_name:
                      req("DELETE", api + "/releases/assets/%d" % a["id"])
                      print("删除旧资产", apk_name)
          except Exception as e:
              print("list assets warn:", e)

          # 3) 上传 APK（uploads 单 IP 常超时 → 重试）
          data = open(apk, "rb").read()
          for i in range(8):
              try:
                  req("POST", api + "/releases/%d/assets?name=%s" % (rel_id, urllib.parse.quote(apk_name)),
                      data=data, binary=True, extra={"Content-Type": "application/octet-stream"})
                  print("✓ 上传成功", apk_name, "(%d bytes)" % len(data))
                  break
              except Exception as e:
                  print("上传重试 %d/8: %s" % (i+1, e)); time.sleep(3)
          else:
              print("✗ 资产上传最终失败"); sys.exit(1)

          # 4) 打印下载地址（开发者据此拉回本地 → 传 GitHub）
          print("下载地址: " + server + "/" + repo + "/releases/tag/" + tag)
          PYEOF
